<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Nómina Juan David Casas</title>
</h:head>
<h:body>
    <h1>Nómina con JSF y Beans</h1>
    <h:form>
        <p:panel header="Datos del Empleado">
            <p:outputLabel value="ID:" />
            <p:inputText value="#{nominaBean.empleado.id}" />
            <p:outputLabel value="Nombre:" />
            <p:inputText value="#{nominaBean.empleado.nombres}" />
            <p:outputLabel value="Salario:" />
            <p:inputText value="#{nominaBean.empleado.salario}" />
            <p:outputLabel value="Días trabajados:" />
            <p:inputText value="#{nominaBean.empleado.dias_t}" />
            <p:commandButton value="Calcular" action="#{nominaBean.calcularNomina}" 
                           update="resultado" />
        </p:panel>
        <p:outputPanel id="resultado">
            <p:panel rendered="#{not empty nominaBean.mensajeResultado}" 
                   style="margin-top: 20px; background: #e8f5e8; padding: 15px;">
                <h3> Total a pagar:</h3>
                <p style="font-size: 18px; color: #2e7d32; font-weight: bold;">
                    #{nominaBean.mensajeResultado}
                </p>
            </p:panel>
        </p:outputPanel>
    </h:form>
</h:body>
</html>
